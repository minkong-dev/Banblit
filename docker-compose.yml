services:
  # 개발용 컨테이너 — 테스트와 개발 작업을 여기서 돌린다.
  dev:
    build:
      context: ./backend
      target: dev
    image: banblit-backend:dev
    volumes:
      # 내 PC의 backend 폴더를 컨테이너 안에 연결한다.
      # 파일을 고치면 다시 빌드하지 않아도 바로 반영된다.
      - ./backend:/app
    working_dir: /app

  # 서버 실행용 — 스케줄링 API 를 로컬에서 띄운다.
  api:
    build:
      context: ./backend
      target: dev
    image: banblit-backend:dev
    command: uvicorn backend.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
