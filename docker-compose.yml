# 배포용이 base 다. 개발용은 이 위에 덮어쓴다(docker-compose.override.yml).
#   배포:  docker compose -f docker-compose.yml up -d
#   개발:  docker compose up -d        (override 가 자동으로 얹힌다)
#
# base 를 개발용으로 두면 개발 전용 표시를 빠뜨린 것이 그대로 현장에 나간다.
# 배포용으로 두면 반대로, 빠뜨려도 개발 머신에 하나 더 뜨는 것으로 끝난다.

services:
  api:
    build:
      context: ./backend
      target: prod
    image: banblit-backend:prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # 로그인 세션 쿠키에 Secure를 붙인다. 배포는 https이므로 켠다 — 개발용
      # override(docker-compose.override.yml)가 이 값을 false로 덮는다.
      COOKIE_SECURE: "true"
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/var/lib/banblit/attachments}
      # 메일 보내기 — 비밀번호 재설정 링크와 아이디 안내가 나가는 계정. 값은 .env 에
      # 적는다(.env.example 참고). SMTP_HOST 가 비면 실제로 보내지 않고 기록만 남으므로,
      # 계정을 받기 전에도 이 줄들을 그대로 두고 띄울 수 있다.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      # 메일에 담을 재설정 링크의 앞부분. 비면 서버가 http://localhost:5173 을 쓴다.
      APP_ORIGIN: "${APP_ORIGIN:-}"
    volumes:
      # 게시판 첨부파일. DB 데이터와 같은 방식으로 이름 있는 볼륨에 둔다 — 컨테이너를
      # 다시 만들어도 남는다. 넣는 자리와 서버가 읽는 자리가 어긋나지 않도록 위
      # ATTACHMENT_DIR 과 같은 값을 쓴다.
      - banblit-attachments:${ATTACHMENT_DIR:-/var/lib/banblit/attachments}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 자동 배정 — 기간에 저장된 연산 시각(first_run_at·second_run_at)이 지나면 스스로
  # 계산을 돌린다. api 와 같은 이미지를 쓰되 통로를 거치지 않고 assign_period 를 직접
  # 부른다. api 를 여러 대로 늘려도 이 서비스만 한 대로 두면 같은 계산이 겹치지 않는다.
  # 첨부파일 볼륨은 붙이지 않는다 — 이 서비스는 배정 계산만 하고 게시판을 읽지 않는다.
  auto-assign:
    build:
      context: ./backend
      target: prod
    image: banblit-backend:prod
    command: python -m backend.jobs.auto_assign
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTO_ASSIGN_ENABLED: "${AUTO_ASSIGN_ENABLED:-true}"
      AUTO_ASSIGN_INTERVAL_SECONDS: "${AUTO_ASSIGN_INTERVAL_SECONDS:-60}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 화면 — 묶인 파일을 nginx 가 내보내고 /api 로 오는 것만 api 로 넘긴다.
  # 넘길 주소는 코드에 박지 않고 환경변수로 준다.
  web:
    build:
      context: ./frontend
      target: prod
    image: banblit-frontend:prod
    environment:
      API_ORIGIN: http://api:8000
      # 이것 없이 두면 nginx 가 제 설정의 $$uri·$$host 까지 빈 값으로 지운다.
      NGINX_ENVSUBST_FILTER: "^API_ORIGIN$$"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # 데이터 저장소. 호스트 포트는 열지 않는다 — 이 PC 에 다른 프로덕트의 postgres 가
  # 있어 5432 가 부딪힌다. 접속은 컨테이너 사이 내부망(db:5432)으로만 한다.
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - banblit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  banblit-db-data:
  banblit-attachments:
  banblit-web-modules:
  banblit-e2e-modules:
