# 배포용 정의 파일입니다. 개발용은 docker-compose.override.yml 이 이 파일 위에 덮어씁니다.
#   배포:  docker compose -f docker-compose.yml up -d
#   개발:  docker compose up -d        (override 가 자동으로 적용됩니다)

# 백엔드 service 가 공유하는 값입니다. 아래에서 *backend-image, *database-url 로 참조합니다.
x-backend-image: &backend-image
  build:
    context: ./backend
    target: prod
  image: banblit-backend:prod

x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
# container 시간대입니다. 시각에 시간대를 붙이지 않으므로 이 값이 기준이고, 모든 service 가 같은 값이어야 합니다.
x-tz: &tz ${TZ:-Asia/Seoul}

services:
  api:
    <<: *backend-image
    environment:
      DATABASE_URL: *database-url
      TZ: *tz
      # 로그인 session cookie 의 Secure 입니다. 배포는 https 이므로 true, 개발용 override 가 false 로 덮어씁니다.
      COOKIE_SECURE: "true"
      # api 앞의 reverse proxy 개수입니다. 배포는 caddy, web(nginx), api 순서이므로 2, 개발용 override 가 1로 덮어씁니다.
      # rate limit 이 X-Forwarded-For 의 뒤에서 이 번째 값을 요청자로 봅니다(backend/src/backend/api/rate_limit.py).
      TRUSTED_PROXY_COUNT: "2"
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/var/lib/banblit/attachments}
      # 메일 발송 계정입니다. 값은 .env 에 작성합니다(.env.example 참고). SMTP_HOST 가 비어 있으면 발송하지 않고 기록만 남깁니다.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      # 메일에 담는 재설정 링크의 주소입니다. 비어 있으면 재설정 메일을 발송하지 않고 오류 로그를 남깁니다.
      APP_ORIGIN: "${APP_ORIGIN:-}"
      # 관리자코드입니다. 가입할 때 이 값을 입력한 계정이 권한 항목 전부를 받습니다. 비어 있으면 관리자 가입이 불가능합니다.
      ADMIN_SIGNUP_CODE: "${ADMIN_SIGNUP_CODE:-}"
      # 소셜 로그인 제공자의 키입니다(.env.example 4-1절). 비어 있는 제공자는 화면에 표시되지 않습니다.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      KAKAO_CLIENT_ID: "${KAKAO_CLIENT_ID:-}"
      KAKAO_CLIENT_SECRET: "${KAKAO_CLIENT_SECRET:-}"
    volumes:
      # 게시판 첨부파일입니다. 경로는 위 ATTACHMENT_DIR 과 같은 값이어야 합니다.
      - banblit-attachments:${ATTACHMENT_DIR:-/var/lib/banblit/attachments}
    # /health 가 DB 연결까지 확인합니다. 실패하면 unhealthy 입니다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 자동 배정입니다. 기간에 저장된 연산 시각(first_run_at, second_run_at)이 지나면 assign_period 를 직접 호출합니다.
  # api 를 여러 대로 늘려도 이 service 는 1대만 둡니다. 첨부파일 volume 은 연결하지 않습니다.
  auto-assign:
    <<: *backend-image
    command: python -m backend.jobs.auto_assign
    environment:
      DATABASE_URL: *database-url
      # api 와 같은 시간대여야 합니다. 다르면 지정한 시각과 다른 시각에 배정이 실행됩니다.
      TZ: *tz
      AUTO_ASSIGN_ENABLED: "${AUTO_ASSIGN_ENABLED:-true}"
      AUTO_ASSIGN_INTERVAL_SECONDS: "${AUTO_ASSIGN_INTERVAL_SECONDS:-60}"
    # 확인 1회가 끝날 때마다 jobs/auto_assign.py 가 heartbeat 파일을 갱신합니다. 확인 간격의 3배 동안 갱신이 없으면 unhealthy 입니다.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/auto-assign-heartbeat') > 3 * int(os.environ.get('AUTO_ASSIGN_INTERVAL_SECONDS', '60')))"]
      interval: 60s
      timeout: 5s
      retries: 3
      # 첫 확인(배정 계산 최대 60초)이 끝나기 전에는 파일이 없으므로 세지 않습니다.
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 화면입니다. nginx 가 build 결과를 제공하고 /api 요청만 api 로 전달합니다.
  web:
    build:
      context: ./frontend
      target: prod
      args:
        # 링크 미리보기 태그의 절대 주소입니다(frontend/index.html). .env 의 APP_ORIGIN 과 같은 값을 씁니다.
        VITE_APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    image: banblit-frontend:prod
    environment:
      API_ORIGIN: http://api:8000
      # 이 값이 없으면 nginx 가 설정 파일의 $$uri, $$host 까지 빈 값으로 치환합니다.
      NGINX_ENVSUBST_FILTER: "^API_ORIGIN$$"
    # 127.0.0.1 에만 bind 합니다. 외부 요청은 caddy 가 받고, 서버 안에서 curl 로 확인합니다.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    # nginx 를 거쳐 api 의 /health 가 응답하는지 확인합니다. nginx 설정 오류와 api 연결 실패를 함께 잡습니다.
    healthcheck:
      # localhost 가 아니라 127.0.0.1 입니다. nginx 는 IPv4 만 열고(frontend/nginx.conf.template 의 listen 80),
      # localhost 가 IPv6(::1)로 풀리면 연결이 거절되어 container 가 unhealthy 가 됩니다.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # reverse proxy 입니다. 인증서를 자동으로 받고 갱신하며 https 로 요청을 받습니다. 설정은 deploy/Caddyfile 입니다.
  # https 가 아니면 브라우저가 Secure cookie 를 저장하지 않아 로그인이 되지 않습니다.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # 배포에서는 반드시 작성합니다. 개발에서는 caddy 가 실행되지 않으므로 비어 있어도 됩니다.
      BANBLIT_DOMAIN: ${BANBLIT_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서입니다. 삭제하면 다시 발급받는데, 같은 주소로 자주 요청하면 발급처가 한동안 거절합니다.
      - banblit-caddy-data:/data
      - banblit-caddy-config:/config
      - banblit-caddy-logs:/var/log/caddy
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # 정기 백업입니다. 데이터베이스와 첨부파일을 host 폴더에 백업합니다. banblit.sh 가 migration 직전 백업에도 이 service 를 씁니다.
  # pg_dump 버전이 서버와 같아야 하므로 db 와 같은 Docker image 를 씁니다.
  backup:
    image: postgres:17
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: *tz
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      # 백업 파일은 volume 이 아니라 host 폴더에 저장합니다.
      - ${BACKUP_DIR:-./backups}:/backups
      - banblit-attachments:/attachments:ro
    # 백업 1회가 성공할 때마다 deploy/backup.sh 가 /tmp/backup-ok 를 갱신합니다. 백업 간격의 2배 동안 갱신이 없으면 unhealthy 입니다.
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /tmp/backup-ok -mmin -$((BACKUP_INTERVAL_HOURS * 120)) 2>/dev/null)\""]
      interval: 10m
      timeout: 10s
      retries: 1
      # 첫 백업이 끝나기 전에는 파일이 없으므로 세지 않습니다.
      start_period: 1h
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 데이터베이스입니다. host 포트를 열지 않고 container 내부망(db:5432)으로만 접속합니다.
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: *tz
    volumes:
      - banblit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  banblit-caddy-data:
  banblit-caddy-config:
  banblit-caddy-logs:
  banblit-db-data:
  banblit-attachments:
