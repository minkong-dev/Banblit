# 배포용이 base 다. 개발용은 이 위에 덮어쓴다(docker-compose.override.yml).
#   배포:  docker compose -f docker-compose.yml up -d
#   개발:  docker compose up -d        (override 가 자동으로 얹힌다)
#
# base 를 개발용으로 두면 개발 전용 표시를 빠뜨린 것이 그대로 현장에 나간다.
# 배포용으로 두면 반대로, 빠뜨려도 개발 머신에 하나 더 뜨는 것으로 끝난다.

services:
  api:
    build:
      context: ./backend
      target: prod
    image: banblit-backend:prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # 로그인 세션 쿠키에 Secure를 붙인다. 배포는 https이므로 켠다 — 개발용
      # override(docker-compose.override.yml)가 이 값을 false로 덮는다.
      COOKIE_SECURE: "true"
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/var/lib/banblit/attachments}
      # 메일 보내기 — 비밀번호 재설정 링크와 아이디 안내가 나가는 계정. 값은 .env 에
      # 적는다(.env.example 참고). SMTP_HOST 가 비면 실제로 보내지 않고 기록만 남으므로,
      # 계정을 받기 전에도 이 줄들을 그대로 두고 띄울 수 있다.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      # 메일에 담을 재설정 링크의 앞부분. 비면 서버가 http://localhost:5173 을 쓴다.
      APP_ORIGIN: "${APP_ORIGIN:-}"
    volumes:
      # 게시판 첨부파일. DB 데이터와 같은 방식으로 이름 있는 볼륨에 둔다 — 컨테이너를
      # 다시 만들어도 남는다. 넣는 자리와 서버가 읽는 자리가 어긋나지 않도록 위
      # ATTACHMENT_DIR 과 같은 값을 쓴다.
      - banblit-attachments:${ATTACHMENT_DIR:-/var/lib/banblit/attachments}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 자동 배정 — 기간에 저장된 연산 시각(first_run_at·second_run_at)이 지나면 스스로
  # 계산을 돌린다. api 와 같은 이미지를 쓰되 통로를 거치지 않고 assign_period 를 직접
  # 부른다. api 를 여러 대로 늘려도 이 서비스만 한 대로 두면 같은 계산이 겹치지 않는다.
  # 첨부파일 볼륨은 붙이지 않는다 — 이 서비스는 배정 계산만 하고 게시판을 읽지 않는다.
  auto-assign:
    build:
      context: ./backend
      target: prod
    image: banblit-backend:prod
    command: python -m backend.jobs.auto_assign
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTO_ASSIGN_ENABLED: "${AUTO_ASSIGN_ENABLED:-true}"
      AUTO_ASSIGN_INTERVAL_SECONDS: "${AUTO_ASSIGN_INTERVAL_SECONDS:-60}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 화면 — 묶인 파일을 nginx 가 내보내고 /api 로 오는 것만 api 로 넘긴다.
  # 넘길 주소는 코드에 박지 않고 환경변수로 준다.
  web:
    build:
      context: ./frontend
      target: prod
    image: banblit-frontend:prod
    environment:
      API_ORIGIN: http://api:8000
      # 이것 없이 두면 nginx 가 제 설정의 $$uri·$$host 까지 빈 값으로 지운다.
      NGINX_ENVSUBST_FILTER: "^API_ORIGIN$$"
    # 바깥에서 직접 닿지 않게 한다 — 들어오는 문은 caddy 하나다. localhost 로 묶어
    # 두는 것은 서버에 SSH 로 들어가 확인할 자리를 남기려는 것이다.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # 앞단 — 인증서를 스스로 받고 갱신하며 https 로 받는다. 설정은 deploy/Caddyfile.
  # 이것이 없으면 로그인이 성립하지 않는다: 위 api 가 쿠키에 Secure 를 붙이는데
  # 브라우저는 http 로 온 Secure 쿠키를 저장하지 않는다.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # 개발에서는 caddy 가 뜨지 않아 비어 있어도 된다. 배포에서는 반드시 채운다.
      BANBLIT_DOMAIN: ${BANBLIT_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 받아 둔 인증서. 이것이 사라지면 다시 받는데, 같은 주소로 자주 받으면
      # 발급처가 한동안 거절한다.
      - banblit-caddy-data:/data
      - banblit-caddy-config:/config
      - banblit-caddy-logs:/var/log/caddy
    depends_on:
      - web
    restart: unless-stopped

  # 정기 백업 — 데이터베이스와 첨부파일을 host 폴더에 한 벌씩 떠 둔다.
  # db 와 같은 이미지를 쓰는 것은 pg_dump 판이 서버와 맞아야 하기 때문이다.
  backup:
    image: postgres:17
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      # 뜬 파일은 volume 이 아니라 host 폴더에 둔다 — volume 이 사라지는 것이
      # 백업이 막아야 할 바로 그 상황이다.
      - ${BACKUP_DIR:-./backups}:/backups
      - banblit-attachments:/attachments:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 데이터 저장소. 호스트 포트는 열지 않는다 — 이 PC 에 다른 프로덕트의 postgres 가
  # 있어 5432 가 부딪힌다. 접속은 컨테이너 사이 내부망(db:5432)으로만 한다.
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - banblit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  banblit-caddy-data:
  banblit-caddy-config:
  banblit-caddy-logs:
  banblit-db-data:
  banblit-attachments:
  banblit-web-modules:
  banblit-e2e-modules:
