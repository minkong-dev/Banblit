services:
  # 개발용 컨테이너 — 테스트와 개발 작업을 여기서 돌린다.
  dev:
    build:
      context: ./backend
      target: dev
    image: banblit-backend:dev
    volumes:
      # 내 PC의 backend 폴더를 컨테이너 안에 연결한다.
      # 파일을 고치면 다시 빌드하지 않아도 바로 반영된다.
      - ./backend:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  # 서버 실행용 — 스케줄링 API 를 로컬에서 띄운다.
  api:
    build:
      context: ./backend
      target: dev
    image: banblit-backend:dev
    command: uvicorn backend.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # 프로토타입 화면을 API 와 같은 출처(localhost:8000/proto)로 내보내려고 붙인다.
      # 출처가 같으면 화면의 fetch 가 CORS 에 막히지 않는다. 읽기 전용으로 건다.
      - ./frontend/prototypes:/proto:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PROTOTYPE_DIR: /proto
    depends_on:
      db:
        condition: service_healthy

  # 화면 개발 서버 — Vite 가 5173 에서 돌고, API 로 가는 요청만 api 로 넘긴다.
  # 넘기는 경로 목록은 frontend/vite.config.ts 가 갖는다.
  web:
    image: node:24-alpine
    working_dir: /app
    # 꾸러미를 먼저 맞춘 뒤 개발 서버를 띄운다. node_modules 는 아래 이름 붙은
    # 저장소에 둔다 — 윈도우 폴더에 그대로 두면 파일이 많아 눈에 띄게 느려진다.
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - banblit-web-modules:/app/node_modules
    environment:
      API_ORIGIN: http://api:8000
    depends_on:
      - api

  # 데이터 저장소 — 개발용 PostgreSQL.
  # 호스트 포트는 열지 않는다: 이 PC에는 다른 프로덕트의 postgres 컨테이너가 있어
  # 5432 충돌을 피한다. 접속은 컨테이너 사이 내부망(db:5432)으로만 한다.
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - banblit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  banblit-db-data:
  banblit-web-modules:
