# 배포용 정의 파일입니다. 개발용은 docker-compose.override.yml 이 이 파일 위에 덮어씁니다.
#   배포:  docker compose -f docker-compose.yml up -d
#   개발:  docker compose up -d        (override 가 자동으로 적용됩니다)

services:
  api:
    build:
      context: ./backend
      target: prod
    image: banblit-backend:prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # container 시간대입니다. 이 저장소는 시각에 시간대를 붙이지 않으므로(CLAUDE.md 6장) 이 값이 기준입니다.
      TZ: ${TZ:-Asia/Seoul}
      # 로그인 session cookie 의 Secure 입니다. 배포는 https 이므로 true, 개발용 override 가 false 로 덮어씁니다.
      COOKIE_SECURE: "true"
      # api 앞의 reverse proxy 개수입니다. 배포는 caddy → web(nginx) → api 이므로 2, 개발용 override 가 1로 덮어씁니다.
      # rate limit 이 X-Forwarded-For 의 뒤에서 이 번째 값을 요청자로 봅니다(backend/src/backend/api/rate_limit.py).
      TRUSTED_PROXY_COUNT: "2"
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/var/lib/banblit/attachments}
      # 메일 발송 계정입니다. 값은 .env 에 작성합니다(.env.example 참고). SMTP_HOST 가 비어 있으면 발송하지 않고 기록만 남깁니다.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      # 메일에 담는 재설정 링크의 주소입니다. 비어 있으면 http://localhost:5173 을 씁니다.
      APP_ORIGIN: "${APP_ORIGIN:-}"
      # 관리자코드입니다. 가입할 때 이 값을 입력한 계정이 권한 항목 전부를 받습니다. 비어 있으면 관리자 가입이 불가능합니다.
      ADMIN_SIGNUP_CODE: "${ADMIN_SIGNUP_CODE:-}"
    volumes:
      # 게시판 첨부파일입니다. 경로는 위 ATTACHMENT_DIR 과 같은 값이어야 합니다.
      - banblit-attachments:${ATTACHMENT_DIR:-/var/lib/banblit/attachments}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 자동 배정입니다. 기간에 저장된 연산 시각(first_run_at·second_run_at)이 지나면 assign_period 를 직접 호출합니다.
  # api 를 여러 대로 늘려도 이 service 는 1대만 둡니다. 첨부파일 volume 은 연결하지 않습니다.
  auto-assign:
    build:
      context: ./backend
      target: prod
    image: banblit-backend:prod
    command: python -m backend.jobs.auto_assign
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # api 와 같은 시간대여야 합니다. 다르면 지정한 시각과 다른 시각에 배정이 실행됩니다.
      TZ: ${TZ:-Asia/Seoul}
      AUTO_ASSIGN_ENABLED: "${AUTO_ASSIGN_ENABLED:-true}"
      AUTO_ASSIGN_INTERVAL_SECONDS: "${AUTO_ASSIGN_INTERVAL_SECONDS:-60}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 화면입니다. nginx 가 빌드 결과를 제공하고 /api 요청만 api 로 전달합니다.
  web:
    build:
      context: ./frontend
      target: prod
      args:
        # 링크 미리보기 태그의 절대 주소입니다(frontend/index.html). .env 의 APP_ORIGIN 과 같은 값을 씁니다.
        VITE_APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    image: banblit-frontend:prod
    environment:
      API_ORIGIN: http://api:8000
      # 이 값이 없으면 nginx 가 설정 파일의 $$uri·$$host 까지 빈 값으로 치환합니다.
      NGINX_ENVSUBST_FILTER: "^API_ORIGIN$$"
    # 외부 요청은 caddy 만 받습니다. localhost 로 묶어 서버 안에서 SSH 로 확인할 수 있게 둡니다.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # reverse proxy 입니다. 인증서를 자동으로 받고 갱신하며 https 로 요청을 받습니다. 설정은 deploy/Caddyfile 입니다.
  # https 가 아니면 브라우저가 Secure cookie 를 저장하지 않아 로그인이 되지 않습니다.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # 배포에서는 반드시 작성합니다. 개발에서는 caddy 가 실행되지 않으므로 비어 있어도 됩니다.
      BANBLIT_DOMAIN: ${BANBLIT_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서입니다. 삭제하면 다시 발급받는데, 같은 주소로 자주 요청하면 발급처가 한동안 거절합니다.
      - banblit-caddy-data:/data
      - banblit-caddy-config:/config
      - banblit-caddy-logs:/var/log/caddy
    depends_on:
      - web
    restart: unless-stopped

  # 정기 백업입니다. 데이터베이스와 첨부파일을 host 폴더에 백업합니다.
  # pg_dump 버전이 서버와 같아야 하므로 db 와 같은 image 를 씁니다.
  backup:
    image: postgres:17
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      # 백업 파일은 volume 이 아니라 host 폴더에 저장합니다.
      - ${BACKUP_DIR:-./backups}:/backups
      - banblit-attachments:/attachments:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 데이터베이스입니다. host 포트를 열지 않습니다(이 PC 의 다른 PostgreSQL 과 5432 충돌). 접속은 container 내부망(db:5432)으로만 합니다.
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - banblit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  banblit-caddy-data:
  banblit-caddy-config:
  banblit-caddy-logs:
  banblit-db-data:
  banblit-attachments:
  banblit-web-modules:
  banblit-e2e-modules:
