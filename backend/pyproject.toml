[project]
name = "backend"
version = "0.1.0"
description = "Banblit 서버입니다. 밴드 동아리의 합주실 예약과 집중 합주기간 자동 배정을 제공합니다."
readme = "README.md"
authors = [
    { name = "minkong-dev", email = "minkyu010521@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "ortools>=9.15.6755",
    "psycopg[binary]>=3.3.4",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# marker 는 tests/conftest.py 가 폴더 이름으로 추가합니다. DB 없이 실행하려면 pytest tests/unit 입니다.
markers = [
    "db: 실행 중인 PostgreSQL 이 필요한 테스트",
    "llm: 실제 LLM 서비스에 접속하는 테스트",
]

[tool.mypy]
# 타입 표기가 없는 함수를 error 로 출력합니다. 설정하지 않으면 mypy 는 표기 없는 함수 본문을 검사하지 않습니다.
files = ["src", "tests"]
python_version = "3.14"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
