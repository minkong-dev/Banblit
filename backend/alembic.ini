# alembic 설정입니다. 접속 주소는 이 파일에 두지 않고 migrations/env.py 가 DATABASE_URL 환경변수에서 읽습니다.

[alembic]
script_location = %(here)s/migrations
# alembic 실행 위치(backend/)를 sys.path 에 추가해 backend.db.models 를 import 합니다.
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
