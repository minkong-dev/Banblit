# 개발용 — base(docker-compose.yml, 배포용) 위에 덮어쓴다. `docker compose up` 이
# 이 파일을 자동으로 얹으므로 따로 -f 를 붙이지 않는다.
# 여기 적힌 것이 곧 "개발에만 있는 것" 이다.

services:
  # 소스를 컨테이너에 걸고, 고치면 서버가 다시 뜬다. 프로토타입 원본을 내보내는
  # 자리도 여기서만 생긴다(PROTOTYPE_DIR 이 없으면 그 자리가 아예 안 만들어진다).
  api:
    build:
      target: dev
    image: banblit-backend:dev
    command: uvicorn backend.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend/prototypes:/proto:ro
    environment:
      PROTOTYPE_DIR: /proto
      # 개발은 http라서 Secure 쿠키가 아예 안 붙는다. base(docker-compose.yml)의
      # true를 여기서 false로 덮는다.
      COOKIE_SECURE: "false"
    restart: "no"

  # 화면 — nginx 대신 Vite 개발 서버가 돈다. node_modules 는 이름 붙은 저장소에
  # 둔다: 윈도우 폴더에 그대로 두면 파일이 많아 눈에 띄게 느려진다.
  web:
    image: node:24-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - banblit-web-modules:/app/node_modules
    environment:
      API_ORIGIN: http://api:8000
    restart: "no"

  # 개발 작업용 — 검사와 마이그레이션을 여기서 돌린다.
  dev:
    build:
      context: ./backend
      target: dev
    image: banblit-backend:dev
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  # 종단(E2E) 검사 — 화면·서버·저장소가 이어져 도는지 사람 흉내로 확인한다.
  # 공식 이미지에 브라우저가 들어 있다. @playwright/test 판 번호와 이미지 태그가
  # 어긋나면 브라우저를 다시 받으려 하므로 맞춰서만 올린다.
  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /app
    command: sh -c "npm install && npx playwright test"
    volumes:
      - ./frontend:/app
      # web 의 node_modules 와 따로 둔다 — 이미지 바탕(Ubuntu)이 web(Alpine)과 달라
      # 같은 자리에 서로 다른 바탕의 네이티브 바이너리가 섞이면 안 된다.
      - banblit-e2e-modules:/app/node_modules
    environment:
      # 컨테이너 사이는 서비스 이름으로 닿는다 — localhost 가 아니다.
      E2E_BASE_URL: http://web:5173
    depends_on:
      - web

  db:
    restart: "no"
