# 개발용 정의 파일입니다. docker-compose.yml(배포용) 위에 덮어씁니다.
# `docker compose up` 이 이 파일을 자동으로 적용하므로 -f 를 지정하지 않습니다.

services:
  # 소스 폴더를 container 에 연결합니다. 파일을 수정하면 서버가 다시 시작됩니다.
  api:
    build:
      target: dev
    image: banblit-backend:dev
    command: uvicorn backend.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # 개발은 http 이므로 Secure cookie 를 끕니다.
      COOKIE_SECURE: "false"
      # 개발에는 caddy 가 없어 api 앞의 reverse proxy 가 1개입니다.
      TRUSTED_PROXY_COUNT: "1"
      # SMTP 가 없을 때 메일 본문(재설정 링크)을 기록에 남깁니다. 개발 전용입니다.
      MAIL_LOG_BODY: "true"
    restart: "no"

  # 자동 배정입니다. 개발에서는 기본값 false 입니다. 켜져 있으면 테스트가 생성한 기간을 이 service 가 다시 계산해 결과가 달라집니다.
  # 화면으로 확인할 때만 AUTO_ASSIGN_ENABLED=true 로 실행합니다(COMMAND.md 13-1).
  auto-assign:
    build:
      target: dev
    image: banblit-backend:dev
    volumes:
      - ./backend:/app
    environment:
      AUTO_ASSIGN_ENABLED: "${AUTO_ASSIGN_ENABLED:-false}"
      AUTO_ASSIGN_INTERVAL_SECONDS: "${AUTO_ASSIGN_INTERVAL_SECONDS:-10}"
    restart: "no"

  # 화면입니다. nginx 대신 Vite 개발 서버를 실행합니다.
  # node_modules 는 named volume 에 둡니다. 윈도우 폴더에 두면 파일 수가 많아 느려집니다.
  web:
    image: node:24-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - banblit-web-modules:/app/node_modules
    environment:
      API_ORIGIN: http://api:8000
      # 개발은 build arg 가 없으므로 여기서 지정합니다. 없으면 index.html 에 %VITE_APP_ORIGIN% 문자열이 그대로 남습니다.
      VITE_APP_ORIGIN: http://localhost:5173
    restart: "no"

  # 개발 작업용입니다. 테스트와 migration 을 이 service 에서 실행합니다.
  dev:
    build:
      context: ./backend
      target: dev
    image: banblit-backend:dev
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # 테스트도 배포와 같은 시간대에서 실행합니다.
      TZ: ${TZ:-Asia/Seoul}
    depends_on:
      db:
        condition: service_healthy

  # E2E 테스트 전용 서버입니다. dev DB 대신 banblit_e2e DB 를 씁니다.
  # 실행할 때마다 그 DB 를 비우고 migration 을 적용합니다. 테스트 계정은 frontend/e2e/global-setup.ts 가 생성합니다.
  # profile 이 있어 `docker compose up` 에는 실행되지 않습니다(COMMAND.md 12-1).
  e2e-api:
    build:
      context: ./backend
      target: dev
    image: banblit-backend:dev
    # manual service 도 이 서버와 DB 를 씁니다. profile 2개를 모두 적어야 `--profile manual` 에서도 실행됩니다.
    profiles: ["e2e", "manual"]
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "python scripts/reset_e2e_db.py && alembic upgrade head && uvicorn backend.api.app:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/banblit_e2e
      TZ: ${TZ:-Asia/Seoul}
      # dev 서버의 첨부파일 volume 과 분리합니다. container 를 다시 생성하면 함께 삭제됩니다.
      ATTACHMENT_DIR: /tmp/banblit-e2e-attachments
      # 테스트가 전체 권한 계정을 생성할 때 쓰는 값입니다. 같은 값이 frontend/e2e/helpers.ts 에 있습니다.
      ADMIN_SIGNUP_CODE: e2e-admin-code
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15
      # DB 초기화와 migration 이 끝나기 전의 실패는 세지 않습니다.
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy

  # E2E 테스트입니다. 공식 Playwright image 에 브라우저가 포함되어 있습니다.
  # @playwright/test 버전과 image 태그가 다르면 브라우저를 다시 내려받으므로 함께 올립니다.
  # Vite 개발 서버는 이 container 안에서 Playwright 가 실행합니다(frontend/playwright.config.ts 의 webServer).
  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: ["e2e"]
    working_dir: /app
    command: sh -c "npm install && npx playwright test"
    volumes:
      - ./frontend:/app
      # web(Alpine)과 base image 가 달라 node_modules 를 분리합니다.
      - banblit-e2e-modules:/app/node_modules
    environment:
      # Vite 개발 서버가 /api 요청을 전달할 주소입니다(frontend/vite.config.ts).
      API_ORIGIN: http://e2e-api:8000
      # 링크 미리보기 태그의 절대 주소입니다. 테스트는 이 값이 치환되었는지만 확인합니다.
      VITE_APP_ORIGIN: http://localhost:5173
    depends_on:
      e2e-api:
        condition: service_healthy

  # 사용자 설명서입니다. 화면을 캡쳐하고 PDF 로 출력합니다(COMMAND.md 15-1).
  # e2e 와 같은 Playwright image 에 한글 글꼴만 추가한 image 를 씁니다(deploy/manual.Dockerfile).
  # e2e-api 와 banblit_e2e DB 를 쓰므로 실행하면 그 DB 가 초기화됩니다. dev DB 는 변경되지 않습니다.
  manual:
    build:
      context: ./deploy
      dockerfile: manual.Dockerfile
    image: banblit-manual:dev
    profiles: ["manual"]
    working_dir: /app
    command: sh -c "npm install && npx playwright test --config manual/playwright.config.ts && npx playwright test --config manual/pdf.config.ts"
    volumes:
      - ./frontend:/app
      # e2e 와 같은 volume 입니다. base image 가 같아 함께 써도 됩니다.
      - banblit-e2e-modules:/app/node_modules
      # 캡쳐 결과와 PDF 가 저장되는 폴더입니다. 설명서 원고도 이 폴더에 있습니다.
      - ./docs:/docs
    environment:
      API_ORIGIN: http://e2e-api:8000
      VITE_APP_ORIGIN: http://localhost:5173
    depends_on:
      e2e-api:
        condition: service_healthy

  db:
    restart: "no"

  # reverse proxy 와 백업은 배포 전용입니다. profile 로 개발에서는 실행되지 않게 합니다.
  caddy:
    profiles: ["deploy-only"]

  backup:
    profiles: ["deploy-only"]
