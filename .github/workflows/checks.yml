# push 와 pull request 마다 서버, 화면, E2E 테스트와 배포용 Docker image build 를 실행합니다.
# docker compose 로 개발과 같은 Docker image 에서 실행합니다. 호스트에 Python, Node 를 설치하지 않습니다.
# .env 는 견본(.env.example)을 복사합니다. 견본의 값은 container 안에서만 쓰는 개발용 값입니다.
name: checks

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 환경 변수 파일 생성
        run: cp .env.example .env

      - name: 서버 테스트
        run: docker compose run --rm dev pytest -q

      # 검사 범위는 backend/pyproject.toml 의 [tool.mypy] files 입니다. banblit.sh check 와 같습니다.
      - name: 타입 검사
        run: docker compose run --rm --no-deps dev mypy

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 환경 변수 파일 생성
        run: cp .env.example .env

      # package.json 이 바뀌어도 volume 이 갱신되지 않는 문제가 dev 환경에 있습니다
      # (COMMAND.md 10-5-1). CI 는 volume 이 매번 비어 있으므로 먼저 설치합니다.
      - name: 화면 패키지 설치
        run: docker compose run --rm --no-deps web npm ci

      - name: 화면 lint
        run: docker compose run --rm --no-deps web npm run lint

      - name: 화면 lint (E2E)
        run: docker compose run --rm --no-deps web npm run lint:e2e

      - name: 화면 타입 검사
        run: docker compose run --rm --no-deps web npm run typecheck

      - name: 화면 테스트
        run: docker compose run --rm --no-deps web npm test

      - name: 화면 빌드
        run: docker compose run --rm --no-deps web npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 환경 변수 파일 생성
        run: cp .env.example .env

      - name: E2E 서버 기동
        run: docker compose --profile e2e up -d --wait e2e-api

      - name: E2E 실행
        run: docker compose --profile e2e run --rm e2e

      # 실패한 테스트의 화면과 추적 파일을 남깁니다. 로그만으로는 어느 요소를 찾지 못했는지
      # 알 수 없습니다.
      - name: 실패 산출물 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/test-results/
          if-no-files-found: ignore

  # 배포 서버가 build 하는 Docker image(backend prod stage, frontend Dockerfile)입니다. 개발 구성만으로는 확인되지 않습니다.
  deploy-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 환경 변수 파일 생성
        run: cp .env.example .env

      - name: 배포용 Docker image build
        run: docker compose -f docker-compose.yml build api web
