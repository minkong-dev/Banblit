<title>배정 결과 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root {
    --bg: #F2F4F6; --card: #FFFFFF; --card-2: #F7F8FA;
    --line: #E9ECEF; --line-2: #D6DBE0;
    --t1: #191F28; --t2: #4E5968; --t3: #8B95A1;
    --blue: #3182F6; --blue-press: #1B64DA; --blue-tint: #E8F3FF;
    --green: #12B886; --green-tint: #E3F7F1;
    --amber: #E8890C; --amber-tint: #FFF4E0;
    --red: #F04452; --red-tint: #FDECEE;
    --c1: #3182F6; --c1-tint: #E8F3FF;
    --c2: #12B886; --c2-tint: #E3F7F1;
    --c3: #8A5CF6; --c3-tint: #F0EBFE;
    --c4: #F76707; --c4-tint: #FFF0E4;
    --shadow: 0 1px 2px rgba(0,23,51,.04), 0 8px 24px rgba(0,23,51,.07);
    --shadow-up: 0 12px 48px rgba(0,23,51,.18);
    --side: 296px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1013; --card: #191C20; --card-2: #212529;
      --line: #2A2F35; --line-2: #3A4148;
      --t1: #E9EDF0; --t2: #A0AAB4; --t3: #6E7882;
      --blue: #4593FC; --blue-press: #6BA9FF; --blue-tint: #17263A;
      --green: #24C79B; --green-tint: #103029;
      --amber: #FFB84D; --amber-tint: #33270D;
      --red: #FF6B75; --red-tint: #331A1D;
      --c1: #4593FC; --c1-tint: #17263A;
      --c2: #24C79B; --c2-tint: #103029;
      --c3: #A57DFF; --c3-tint: #241D3A;
      --c4: #FF9147; --c4-tint: #34220F;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --shadow-up: 0 16px 56px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1013; --card: #191C20; --card-2: #212529;
    --line: #2A2F35; --line-2: #3A4148;
    --t1: #E9EDF0; --t2: #A0AAB4; --t3: #6E7882;
    --blue: #4593FC; --blue-press: #6BA9FF; --blue-tint: #17263A;
    --green: #24C79B; --green-tint: #103029;
    --amber: #FFB84D; --amber-tint: #33270D;
    --red: #FF6B75; --red-tint: #331A1D;
    --c1: #4593FC; --c1-tint: #17263A;
    --c2: #24C79B; --c2-tint: #103029;
    --c3: #A57DFF; --c3-tint: #241D3A;
    --c4: #FF9147; --c4-tint: #34220F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-up: 0 16px 56px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  /* 최소 창 크기 — 이 아래로는 요소가 겹친다.
     가로 700px: 달력이 날짜별 세로 목록으로 바뀐 뒤, 날짜칸 58 + 합주 이름과 시각 한 줄.
     세로 680px: 상단바 62 + 탭 58 + 달력 머리 60 + 목록 최소 높이 + 설명 영역. */
  html { overflow: auto; }
  body { min-width: 700px; min-height: 680px; }
  body {
    margin: 0; background: var(--bg); color: var(--t1);
    font-family: "Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.6; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; height: 100vh; overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  button, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; background: none; border: none; padding: 0; }
  :where(a, button, select):focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 8px; }

  .top { background: var(--card); border-bottom: 1px solid var(--line); }
  .top .in { height: 62px; padding: 0 18px; display: flex; align-items: center; gap: 8px; }
  .logo { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
  .logo b { font-size: 19px; font-weight: 700; }
  .logo span { font-size: 13px; color: var(--t3); }
  .ic { width: 44px; height: 44px; display: grid; place-items: center; color: var(--t2); border-radius: 12px; transition: background-color .15s ease, color .15s ease; }
  .ic:hover { background: var(--card-2); color: var(--t1); }
  .ic svg { width: 21px; height: 21px; }
  #menuBtn { display: none; }
  .profbtn { display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 6px; min-height: 44px; border-radius: 999px; }
  .profbtn:hover { background: var(--card-2); }
  .face { width: 32px; height: 32px; border-radius: 50%; background: var(--blue-tint); color: var(--blue); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .profbtn .nm { font-size: 14.5px; font-weight: 500; }
  .role { font-size: 11.5px; font-weight: 700; color: var(--blue); background: var(--blue-tint); padding: 3px 9px; border-radius: 999px; }

  .shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); height: calc(100vh - 62px); }
  .side { overflow: hidden auto; background: var(--card); border-right: 1px solid var(--line); }
  .side .inner { width: 296px; height: 100%; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; }
  .side nav { display: flex; flex-direction: column; gap: 2px; }
  .side nav a { display: flex; align-items: center; padding: 12px; min-height: 46px; color: var(--t1); text-decoration: none; font-size: 15px; font-weight: 500; border-radius: 10px; white-space: nowrap; }
  .side nav a:hover { background: var(--card-2); }
  .side nav a[aria-current="page"] { background: var(--blue-tint); color: var(--blue); font-weight: 700; }
  .side .cap { font-size: 12px; color: var(--t3); padding: 0 12px; }
  .side .sep { border-top: 1px solid var(--line); }

  .page { height: 100%; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); column-gap: 18px; min-height: 0; }
  .tabs { grid-column: 1; grid-row: 1; display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { padding: 10px 18px; min-height: 44px; border-radius: 999px; background: var(--card); color: var(--t2); font-size: 14.5px; font-weight: 500; box-shadow: var(--shadow); transition: background-color .15s ease, color .15s ease; }
  .tab:hover { color: var(--t1); }
  .tab[aria-selected="true"] { background: var(--blue); color: #fff; font-weight: 700; }
  .tab.ghost[aria-selected="true"] { background: var(--t1); color: var(--card); }

  .main { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; min-height: 0; gap: 14px; overflow-y: auto; }
  .rail { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }

  /* 미리보기 알림 */
  .peek { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 18px; background: var(--t1); color: var(--card); border-radius: 16px; font-size: 14px; }
  .peek b { font-weight: 700; }
  .peek .go { margin-left: auto; display: flex; gap: 8px; }
  .peek button { min-height: 42px; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 700; }
  .peek .back { color: var(--card); opacity: .7; }
  .peek .back:hover { opacity: 1; }
  .peek .do { background: var(--card); color: var(--t1); }

  /* 캘린더 */
  .calhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .calhead b { font-size: 16.5px; font-weight: 700; }
  .calhead span { font-size: 13.5px; color: var(--t3); }
  .calhead .keys { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; }
  .calhead .keys i { display: inline-flex; align-items: center; gap: 6px; font-style: normal; font-size: 12.5px; color: var(--t2); }
  .calhead .keys i em { width: 9px; height: 9px; border-radius: 50%; }

  .dow { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); }
  .dow span { padding: 9px 0; text-align: center; font-size: 12.5px; color: var(--t3); }
  .dow span:last-child { color: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .day { min-height: 118px; padding: 9px 8px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
  .day:nth-child(7n) { border-right: none; }
  .day .n { font-size: 13.5px; font-weight: 500; color: var(--t2); }
  .day.sunday .n { color: var(--red); }
  .day .free { margin-top: auto; font-size: 11.5px; color: var(--t3); }

  .ses { border-radius: 9px; padding: 6px 9px; font-size: 12.5px; font-weight: 700; line-height: 1.35; }
  .ses small { display: block; font-weight: 400; font-size: 11.5px; opacity: .85; }
  .ses.c1 { background: var(--c1-tint); color: var(--c1); }
  .ses.c2 { background: var(--c2-tint); color: var(--c2); }
  .ses.c3 { background: var(--c3-tint); color: var(--c3); }
  .ses.c4 { background: var(--c4-tint); color: var(--c4); }
  .ses.new { box-shadow: 0 0 0 2px var(--green); }
  .ses.gone { opacity: .4; text-decoration: line-through; }
  .ses .out { display: block; font-weight: 700; font-size: 11.5px; color: var(--amber); text-decoration: none; margin-top: 3px; }

  /* 캘린더 아래 설명 */
  .under { padding: 20px 22px 22px; }
  .under h2 { margin: 0 0 4px; font-size: 16.5px; font-weight: 700; letter-spacing: -.03em; }
  .under .sub { margin: 0 0 16px; font-size: 13.5px; color: var(--t3); }
  .counts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .cnt { display: flex; align-items: center; gap: 9px; padding: 10px 14px; background: var(--card-2); border-radius: 12px; font-size: 13.5px; }
  .cnt i { width: 9px; height: 9px; border-radius: 50%; }
  .cnt b { font-weight: 700; }
  .cnt.short b { color: var(--red); }

  .changes { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .changes li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .changes li:last-child { border-bottom: 1px solid var(--line); }
  .changes .mk { flex: none; width: 62px; font-size: 12px; font-weight: 700; padding: 2px 0; }
  .changes .add { color: var(--green); }
  .changes .out { color: var(--amber); }
  .changes .del { color: var(--red); }
  .changes span { color: var(--t2); }
  .changes b { color: var(--t1); font-weight: 700; }

  .act { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { min-height: 50px; padding: 14px 22px; border-radius: 12px; background: var(--card-2); color: var(--t2); font-size: 15px; font-weight: 700; transition: background-color .15s ease, color .15s ease; }
  .btn:hover { color: var(--t1); }
  .btn.main { background: var(--blue); color: #fff; }
  .btn.main:hover { background: var(--blue-press); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .note { padding: 15px 17px; background: var(--amber-tint); border-radius: 13px; font-size: 13.5px; color: var(--t2); line-height: 1.75; margin-bottom: 18px; }
  .note b { color: var(--t1); font-weight: 700; }

  /* 오른쪽 */
  .panel { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .panel .ph { display: flex; align-items: center; padding: 16px 18px; font-size: 15.5px; font-weight: 700; }
  .panel .ph span { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--t3); }
  .panel ul { list-style: none; margin: 0; padding: 0 10px 12px; overflow-y: auto; min-height: 0; }
  .ver { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px 10px; border-radius: 12px; text-align: left; }
  .ver:hover { background: var(--card-2); }
  .ver[aria-current="true"] { background: var(--blue-tint); }
  .ver .v { font-size: 13px; font-weight: 700; color: var(--t3); width: 28px; flex: none; }
  .ver .mid b { display: block; font-size: 14px; font-weight: 500; }
  .ver .mid small { font-size: 12.5px; color: var(--t3); }
  .ver .st { margin-left: auto; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .st.ok { background: var(--green-tint); color: var(--green); }
  .st.warn { background: var(--amber-tint); color: var(--amber); }
  .st.bad { background: var(--red-tint); color: var(--red); }
  .st.now { background: var(--blue-tint); color: var(--blue); }

  .times { padding: 18px; }
  .times .k { font-size: 12.5px; color: var(--t3); }
  .times .t { font-size: 22px; font-weight: 700; letter-spacing: -.04em; margin: 4px 0 14px; }
  .times .rows { display: flex; gap: 10px; }
  .times select { flex: 1; min-height: 48px; padding: 12px 14px; background: var(--card-2); border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .times .save { width: 100%; margin-top: 12px; min-height: 46px; border-radius: 12px; background: var(--card-2); color: var(--t2); font-size: 14px; font-weight: 700; }
  .times .save:hover { color: var(--t1); }
  .times .save.on { background: var(--blue); color: #fff; }
  .times p { margin: 12px 0 0; font-size: 13px; color: var(--t3); line-height: 1.7; }

  dialog { width: min(460px, calc(100vw - 40px)); padding: 0; border: none; border-radius: 22px; background: var(--card); color: var(--t1); box-shadow: var(--shadow-up); }
  dialog::backdrop { background: rgba(10,14,20,.5); }
  .mh { padding: 26px 26px 12px; }
  .mh h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.03em; }
  .mh p { margin: 10px 0 0; font-size: 14px; color: var(--t2); line-height: 1.75; }
  .mf { padding: 18px 26px 24px; display: flex; gap: 10px; }
  .mf .btn { flex: 1; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 160%); z-index: 60; padding: 14px 22px; background: var(--t1); color: var(--card); font-size: 14.5px; font-weight: 500; border-radius: 14px; transition: transform .26s cubic-bezier(.22,1,.36,1); }
  .toast.on { transform: translate(-50%, 0); }
  /* 좁은 화면 — 7열 달력을 날짜별 세로 목록으로 바꾼다 */

  /* ===== 창이 좁아지면 요소가 움직인다 ===== */
  @media (max-width: 1240px) {
    .shell { --side: 264px; }
    .page { grid-template-columns: minmax(0, 1fr) 316px; column-gap: 14px; padding: 14px; }
    .panel > .ph { padding: 13px 15px; font-size: 14.5px; }
    .panel li a { padding: 9px; font-size: 13.5px; }
  }
  @media (max-width: 1040px) {
    .shell { --side: 0px; }
    #menuBtn { display: grid; }
    .side { position: fixed; inset: 62px auto 0 0; z-index: 41; width: 264px;
            transform: translateX(-101%); transition: transform .24s ease; }
    body.navopen .side { transform: none; box-shadow: var(--shadow-up); }
    .page { grid-template-columns: minmax(0, 1fr); }
    .rail { grid-column: 1; flex-direction: row; gap: 12px; }
    .rail .panel { flex: 1 1 0; }
  }
  @media (max-width: 860px) {
    .page { padding: 12px; }
    .tabs { overflow-x: auto; }
    .rail { flex-direction: column; }
  }
  @media (max-width: 860px) {
    .dow { display: none; }
    .grid { grid-template-columns: 1fr; }
    .day { display: grid; grid-template-columns: 58px minmax(0, 1fr); align-items: start;
           gap: 7px 12px; min-height: 0; padding: 12px 14px; border-right: none; }
    .day .n { grid-row: 1 / span 99; font-weight: 700; font-size: 15px; }
    .day .free { margin: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>

<header class="top">
  <div class="in">
    <button class="ic" id="menuBtn" aria-label="메뉴 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="logo"><b>Banblit</b><span>IN SIX STRINGS · A실</span></div>
    <button class="ic" id="themeBtn" aria-label="어두운 화면으로 바꾸기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M21 13a8.5 8.5 0 1 1-10-10 7 7 0 0 0 10 10Z"/></svg></button>
    <button class="profbtn"><span class="face" aria-hidden="true">박서</span><span class="nm">박서연</span><span class="role">헤드매니저</span></button>
  </div>
</header>

<div class="shell">
  <aside class="side" aria-label="메뉴">
    <div class="inner">
      <nav>
        <a href="#">합주실 시간표</a>
        <a href="#">공지사항</a>
        <a href="#">팀 찾기</a>
        <a href="#">팀 게시판</a>
      </nav>
      <div class="sep"></div>
      <div class="cap">헤드매니저</div>
      <nav>
        <a href="#" aria-current="page">배정 결과 확인</a>
        <a href="#">합주실·기간 설정</a>
      </nav>
    </div>
  </aside>

  <div class="page">
    <div class="tabs" role="tablist" aria-label="배정안" id="tabs"></div>

    <div class="main">
      <div id="peek"></div>
      <div class="card">
        <div class="calhead">
          <b>집중 합주기간</b><span>9월 14일 – 9월 27일 · A실 10:00–22:00</span>
          <div class="keys" id="keys"></div>
        </div>
        <div class="dow"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
        <div class="grid" id="cal"></div>
        <div class="under" id="under"></div>
      </div>
    </div>

    <div class="rail">
      <section class="panel">
        <div class="ph">지난 계산<span>누르면 그때 시간표를 봅니다</span></div>
        <ul id="vers"></ul>
      </section>
      <section class="panel">
        <div class="times">
          <div class="k">계산이 도는 시각</div>
          <div class="t" id="tShow">06:00 · 18:00</div>
          <div class="rows">
            <select id="t1" aria-label="첫 번째 계산 시각"></select>
            <select id="t2" aria-label="두 번째 계산 시각"></select>
          </div>
          <button class="save" id="tSave">바꾼 시각 저장</button>
          <p>하루 두 번 돕니다. 계산이 시작될 때 부원들에게 알림이 갑니다.</p>
        </div>
      </section>
    </div>
  </div>
</div>

<dialog id="ask">
  <div class="mh"><h3 id="askT"></h3><p id="askP"></p></div>
  <div class="mf"><button class="btn" id="askNo">그만두기</button><button class="btn main" id="askYes">확인</button></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";


  const $ = (id) => document.getElementById(id);

  const TEAMS = { c1: "새벽 네시", c2: "파랑주의보", c3: "오프비트", c4: "라스트 테이크" };
  const GOAL = 6;              // 팀마다 채워야 하는 합주 횟수
  const D0 = 14, D1 = 27;      // 집중기간 9월 14일 ~ 27일 (월요일 시작)
  const SUNDAY = [20, 27];

  // 지금 확정된 시간표. 새벽 네시만 6번을 못 채웠다.
  const BASE = [
    { d: 14, k: "c2", a: "19:00", b: "21:00" }, { d: 14, k: "c3", a: "17:00", b: "19:00" },
    { d: 15, k: "c1", a: "19:00", b: "21:00" }, { d: 15, k: "c4", a: "17:00", b: "19:00" },
    { d: 16, k: "c3", a: "19:00", b: "21:00" },
    { d: 17, k: "c2", a: "19:00", b: "21:00" },
    { d: 18, k: "c4", a: "19:00", b: "21:00" },
    { d: 19, k: "c1", a: "14:00", b: "16:00" }, { d: 19, k: "c2", a: "16:00", b: "18:00" },
    { d: 20, k: "c3", a: "14:00", b: "16:00" }, { d: 20, k: "c4", a: "16:00", b: "18:00" },
    { d: 21, k: "c2", a: "19:00", b: "21:00" },
    { d: 22, k: "c1", a: "19:00", b: "21:00" }, { d: 22, k: "c3", a: "17:00", b: "19:00" },
    { d: 23, k: "c4", a: "19:00", b: "21:00" },
    { d: 24, k: "c2", a: "19:00", b: "21:00" },
    { d: 25, k: "c3", a: "19:00", b: "21:00" },
    { d: 26, k: "c1", a: "14:00", b: "16:00" }, { d: 26, k: "c4", a: "16:00", b: "18:00" },
    { d: 27, k: "c2", a: "14:00", b: "16:00" }, { d: 27, k: "c3", a: "16:00", b: "18:00" }, { d: 27, k: "c4", a: "19:00", b: "21:00" }
  ];

  // 제외는 "그 시간대 합주 하나"에서 그 사람만 빠지는 것이다.
  const PLANS = {
    A: {
      name: "A안", tip: "김민서(드럼) 이 두 번 빠집니다",
      add: [
        { d: 16, k: "c1", a: "17:00", b: "19:00", out: "김민서(드럼)" },
        { d: 18, k: "c1", a: "17:00", b: "19:00", out: "김민서(드럼)" }
      ],
      del: [],
      lines: [
        ["add", "9월 16일 17:00–19:00", "새벽 네시 합주가 새로 잡힙니다"],
        ["add", "9월 18일 17:00–19:00", "새벽 네시 합주가 새로 잡힙니다"],
        ["out", "위 두 합주", "김민서(드럼) 이 그 시간에만 빠집니다. 다른 날 합주에는 그대로 나옵니다"],
        ["", "결과", "네 팀 모두 합주 6번이 됩니다"]
      ]
    },
    B: {
      name: "B안", tip: "최유진(베이스) 이 두 번 빠집니다",
      add: [
        { d: 17, k: "c1", a: "17:00", b: "19:00", out: "최유진(베이스)" },
        { d: 23, k: "c1", a: "17:00", b: "19:00", out: "최유진(베이스)" }
      ],
      del: [],
      lines: [
        ["add", "9월 17일 17:00–19:00", "새벽 네시 합주가 새로 잡힙니다"],
        ["add", "9월 23일 17:00–19:00", "새벽 네시 합주가 새로 잡힙니다"],
        ["out", "위 두 합주", "최유진(베이스) 이 그 시간에만 빠집니다. 오프비트 합주와 겹치는 시간이기 때문입니다"],
        ["", "결과", "네 팀 모두 합주 6번이 됩니다"]
      ]
    },
    C: {
      name: "C안", tip: "아무도 빠지지 않습니다",
      add: [],
      del: [
        { d: 24, k: "c2" }, { d: 27, k: "c2" },
        { d: 25, k: "c3" }, { d: 27, k: "c3" },
        { d: 26, k: "c4" }, { d: 27, k: "c4" }
      ],
      lines: [
        ["del", "9월 24일 · 27일", "파랑주의보 합주 두 번이 없어집니다"],
        ["del", "9월 25일 · 27일", "오프비트 합주 두 번이 없어집니다"],
        ["del", "9월 26일 · 27일", "라스트 테이크 합주 두 번이 없어집니다"],
        ["", "결과", "아무도 빠지지 않는 대신 네 팀 모두 합주 4번이 됩니다"]
      ]
    }
  };

  // 지난 계산 결과. 누르면 캘린더가 그때 상태로 바뀐다.
  const VERS = [
    { v: 4, at: "9월 2일 06:00", by: "자동", st: "warn", label: "조율 필요", del: [], add: [] },
    { v: 3, at: "9월 1일 18:00", by: "자동", st: "ok", label: "확정",
      del: [{ d: 22, k: "c1" }], add: [{ d: 21, k: "c1", a: "17:00", b: "19:00" }] },
    { v: 2, at: "9월 1일 06:00", by: "자동", st: "ok", label: "확정",
      del: [{ d: 19, k: "c1" }, { d: 26, k: "c1" }], add: [{ d: 15, k: "c3", a: "15:00", b: "17:00" }] },
    { v: 1, at: "8월 31일 18:00", by: "박서연", st: "bad", label: "입력 오류", del: [], add: [] }
  ];

  let view = "now";     // now | A | B | C | v3 | v2 | v1
  const KEY = (s) => s.d + s.k;

  function sessions() {
    let list = BASE.map((s) => ({ ...s }));
    const mod = view.startsWith("v") ? VERS.find((x) => "v" + x.v === view) : PLANS[view];
    if (mod) {
      const gone = new Set((mod.del || []).map(KEY));
      list = list.map((s) => (gone.has(KEY(s)) ? { ...s, gone: true } : s));
      (mod.add || []).forEach((s) => list.push({ ...s, isNew: true }));
    }
    return list;
  }

  function counts(list) {
    const c = { c1: 0, c2: 0, c3: 0, c4: 0 };
    list.forEach((s) => { if (!s.gone) c[s.k]++; });
    return c;
  }

  function renderTabs() {
    const items = [["now", "지금 확정된 것"], ["A", "A안"], ["B", "B안"], ["C", "C안"]];
    $("tabs").innerHTML = items.map(([k, t]) =>
      '<button class="tab" role="tab" data-view="' + k + '" aria-selected="' + (view === k) + '">' + t + "</button>").join("") +
      (view.startsWith("v") ? '<button class="tab ghost" role="tab" aria-selected="true">' + view + " 미리보기</button>" : "");
    $("tabs").querySelectorAll("[data-view]").forEach((b) => {
      b.onclick = () => { view = b.dataset.view; render(); };
    });
  }

  function renderCal() {
    const list = sessions();
    let html = "";
    for (let d = D0; d <= D1; d++) {
      const items = list.filter((s) => s.d === d).sort((x, y) => x.a.localeCompare(y.a));
      const body = items.map((s) =>
        '<div class="ses ' + s.k + (s.isNew ? " new" : "") + (s.gone ? " gone" : "") + '">' +
        TEAMS[s.k] + "<small>" + s.a + "–" + s.b + "</small>" +
        (s.out ? '<span class="out">' + s.out + " 빠짐</span>" : "") + "</div>").join("");
      const busy = items.filter((s) => !s.gone).length;
      html += '<div class="day' + (SUNDAY.includes(d) ? " sunday" : "") + '"><span class="n">' + d + "</span>" + body +
        (busy ? "" : '<span class="free">합주 없음</span>') + "</div>";
    }
    $("cal").innerHTML = html;
    $("keys").innerHTML = Object.keys(TEAMS).map((k) =>
      '<i><em style="background:var(--' + k + ')"></em>' + TEAMS[k] + "</i>").join("");
  }

  function renderUnder() {
    const list = sessions(), c = counts(list);
    const goal = view === "C" ? 4 : GOAL;
    const row = Object.keys(TEAMS).map((k) =>
      '<span class="cnt' + (c[k] < goal ? " short" : "") + '"><i style="background:var(--' + k + ')"></i>' +
      TEAMS[k] + ' 합주 <b>' + c[k] + "번</b></span>").join("");

    if (view.startsWith("v")) {
      const v = VERS.find((x) => "v" + x.v === view);
      $("under").innerHTML = '<h2>' + view + " 때의 시간표입니다</h2>" +
        '<p class="sub">' + v.at + " · " + v.by + "</p>" + '<div class="counts">' + row + "</div>" +
        '<div class="act"><button class="btn main" id="doRoll">이 시간표로 되돌리기</button>' +
        '<button class="btn" id="back">지금 것으로 돌아가기</button></div>';
      $("doRoll").onclick = () => ask("이 시간표로 되돌릴까요?",
        "지금 시간표가 " + v.at + " 때의 배정으로 바뀝니다. 그 뒤에 들어온 예약은 그대로 두고, 시간이 겹치면 되돌리기를 거부합니다.",
        () => { const t = view; view = "now"; render(); say(t + " 시간표로 되돌렸습니다"); });
      $("back").onclick = () => { view = "now"; render(); };
      return;
    }

    if (view === "now") {
      $("under").innerHTML = "<h2>새벽 네시가 합주 두 번을 못 채웠습니다</h2>" +
        '<p class="sub">전원이 나올 수 있는 시간을 못 찾았습니다. 빈 시간표를 내보내지 않고 여기서 멈췄습니다.</p>' +
        '<div class="counts">' + row + "</div>" +
        '<div class="note">위 탭에서 <b>A안·B안·C안</b>을 누르면 그 안대로 바뀐 시간표가 이 달력에 그대로 보입니다. 초록 테두리가 새로 잡히는 합주, 흐린 것이 없어지는 합주입니다.</div>' +
        '<div class="act"><button class="btn" id="again">지금 다시 계산</button></div>';
      $("again").onclick = (e) => {
        e.target.disabled = true; e.target.textContent = "계산하는 중…";
        setTimeout(() => { render(); say("다시 계산했습니다 · 결과는 그대로입니다"); }, 1400);
      };
      return;
    }

    const p = PLANS[view];
    $("under").innerHTML = "<h2>" + p.name + "을 고르면 이렇게 바뀝니다</h2>" +
      '<p class="sub">' + p.tip + "</p>" + '<div class="counts">' + row + "</div>" +
      '<ul class="changes">' + p.lines.map(([mk, t, d]) =>
        '<li><span class="mk ' + mk + '">' + (mk === "add" ? "새로" : mk === "out" ? "빠짐" : mk === "del" ? "없어짐" : "") + "</span>" +
        "<span><b>" + t + "</b> — " + d + "</span></li>").join("") + "</ul>" +
      '<div class="note">누구의 <b>안 되는 시간도 무시하지 않았습니다.</b> 빠지는 사람은 그 시간대 합주에만 빠지고, 확정하면 본인에게 알림이 갑니다.</div>' +
      '<div class="act"><button class="btn main" id="pick">' + p.name + "으로 확정</button>" +
      '<button class="btn" id="back">지금 것으로 돌아가기</button></div>';
    $("pick").onclick = () => ask(p.name + "으로 확정할까요?",
      p.tip + ". 확정하면 부원들의 시간표에 바로 올라갑니다.",
      () => { view = "now"; render(); say(p.name + "으로 확정했습니다"); });
    $("back").onclick = () => { view = "now"; render(); };
  }

  function renderPeek() {
    if (!view.startsWith("v")) { $("peek").innerHTML = ""; return; }
    const v = VERS.find((x) => "v" + x.v === view);
    $("peek").innerHTML = '<div class="peek"><b>' + view + " 미리보기</b>" + v.at + " 계산 결과를 보고 있습니다. 아직 아무것도 바뀌지 않았습니다." +
      '<span class="go"><button class="back" id="peekBack">닫기</button></span></div>';
    $("peekBack").onclick = () => { view = "now"; render(); };
  }

  function renderVers() {
    $("vers").innerHTML = VERS.map((v, i) =>
      '<li><button class="ver" data-v="v' + v.v + '" aria-current="' + (view === "v" + v.v) + '">' +
      '<span class="v">v' + v.v + "</span>" +
      '<span class="mid"><b>' + v.at + "</b><small>" + v.by + "</small></span>" +
      '<span class="st ' + (i === 0 ? "now" : v.st) + '">' + (i === 0 ? "지금" : v.label) + "</span></button></li>").join("");
    $("vers").querySelectorAll("[data-v]").forEach((b) => {
      b.onclick = () => { view = b.dataset.v === "v4" ? "now" : b.dataset.v; render(); };
    });
  }

  // 계산 시각 — 여기서 바로 고친다
  const opts = () => {
    let s = "";
    for (let h = 0; h < 24; h++) s += '<option value="' + String(h).padStart(2, "0") + ':00">' + String(h).padStart(2, "0") + ":00</option>";
    return s;
  };
  $("t1").innerHTML = opts(); $("t2").innerHTML = opts();
  $("t1").value = "06:00"; $("t2").value = "18:00";
  const dirty = () => {
    const changed = $("t1").value !== saved[0] || $("t2").value !== saved[1];
    $("tSave").classList.toggle("on", changed);
    $("tSave").textContent = changed ? "바꾼 시각 저장" : "저장됨";
  };
  let saved = ["06:00", "18:00"];
  $("t1").onchange = dirty; $("t2").onchange = dirty;
  $("tSave").onclick = () => {
    if ($("t1").value === $("t2").value) { say("두 시각이 같습니다. 다르게 골라 주세요"); return; }
    saved = [$("t1").value, $("t2").value].sort();
    $("t1").value = saved[0]; $("t2").value = saved[1];
    $("tShow").textContent = saved[0] + " · " + saved[1];
    dirty(); say("계산 시각을 " + saved.join(" 와 ") + " 로 바꿨습니다");
  };
  dirty();

  const dlg = $("ask");
  let onYes = null;
  function ask(t, p, fn) { $("askT").textContent = t; $("askP").textContent = p; onYes = fn; dlg.showModal(); }
  $("askNo").onclick = () => dlg.close();
  $("askYes").onclick = () => { dlg.close(); if (onYes) onYes(); };

  $("menuBtn").onclick = () => document.body.classList.toggle("navopen");
  $("themeBtn").onclick = () => {
    const sys = matchMedia("(prefers-color-scheme: dark)").matches;
    const now = document.documentElement.dataset.theme || (sys ? "dark" : "light");
    const nx = now === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = nx;
    $("themeBtn").setAttribute("aria-label", nx === "dark" ? "밝은 화면으로 바꾸기" : "어두운 화면으로 바꾸기");
  };

  let tm;
  function say(msg) {
    const el = $("toast");
    el.textContent = msg; el.classList.add("on");
    clearTimeout(tm); tm = setTimeout(() => el.classList.remove("on"), 2800);
  }

  function render() { renderTabs(); renderPeek(); renderCal(); renderUnder(); renderVers(); }
  render();
})();
</script>
