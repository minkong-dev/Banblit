<title>Banblit 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<style>
  /* 랜딩과 같은 한 가지 모습으로 고정한다. 왼쪽 사진에서 오른쪽 흰 지면으로
     넘어가는 대비가 이 페이지의 인상이라 보는 사람의 화면 설정을 따르지 않는다. */
  :root {
    --ink: #0E0F11; --ink-2: #4E5460; --ink-3: #8B9099;
    --paper: #FFFFFF; --paper-2: #F5F6F7;
    --edge: #E4E6E9; --edge-2: #CDD1D6;
    --coral: #FF6161; --coral-press: #E84B4B; --coral-tint: #FFEFEF;
    --red: #E03B3B;
    --kakao: #FEE500; --kakao-ink: #191600;
  }

  * { box-sizing: border-box; }
  /* 최소 창 크기 — 이 아래로는 요소가 겹친다.
     가로 420px: 서식 한 벌의 최소 폭 388 + 좌우 여백 36.
     세로 620px: 사진 200 + 제목 74 + 입력 네 줄 + 버튼. */
  html { overflow: auto; }
  body { min-width: 420px; min-height: 620px; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.6; letter-spacing: -.025em;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; background: none; border: none; padding: 0; }
  a { color: inherit; }
  :where(a, button, input):focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; border-radius: 6px; }

  .split { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 100vh; }

  /* ===== 왼쪽 사진 ===== */

  .stage .mark { font-size: 17px; font-weight: 900; letter-spacing: .16em; }
  .stage .say { margin-top: auto; }
  .stage .say h1 {
    margin: 0; font-size: clamp(24px, 2.4vw, 34px); font-weight: 700;
    line-height: 1.5; letter-spacing: -.045em;
  }
  .stage .say h1 em { font-style: normal; color: var(--coral); font-weight: 900; letter-spacing: .04em; }
  .stage .say p { margin: 16px 0 0; font-size: 14.5px; font-weight: 300; color: #C6CAD0; }

  /* ===== 오른쪽 서식 ===== */
  .form { display: flex; align-items: center; justify-content: center; padding: 48px 40px; }
  .inner { width: 100%; max-width: 388px; }

  .head { margin-bottom: 30px; }
  .head h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.04em; }
  .head p { margin: 8px 0 0; font-size: 14.5px; color: var(--ink-3); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 7px; }
  .field input {
    width: 100%; min-height: 52px; padding: 14px 16px;
    background: var(--paper-2); border: 1px solid transparent; border-radius: 12px;
    font-size: 15.5px;
    transition: border-color .16s ease, background-color .16s ease;
  }
  .field input::placeholder { color: var(--ink-3); }
  .field input:hover { background: #F0F1F3; }
  .field input:focus { background: var(--paper); border-color: var(--ink); outline: none; }
  .field input[aria-invalid="true"] { border-color: var(--red); background: #FEF5F5; }
  .field .bad { display: none; margin: 7px 0 0; font-size: 12.5px; color: var(--red); font-weight: 500; }
  .field.err .bad { display: block; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 22px; }
  .keep { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; min-height: 44px; }
  .keep input { width: 17px; height: 17px; accent-color: var(--coral); cursor: pointer; }
  .row a { font-size: 13.5px; color: var(--ink-3); text-decoration: none; }
  .row a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  .go {
    width: 100%; min-height: 54px; padding: 15px;
    background: var(--coral); color: #fff; border-radius: 12px;
    font-size: 16px; font-weight: 700;
    transition: background-color .16s ease;
  }
  .go:hover { background: var(--coral-press); }

  .or { display: flex; align-items: center; gap: 14px; margin: 28px 0 18px; color: var(--ink-3); font-size: 12.5px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--edge); }

  .social { display: flex; flex-direction: column; gap: 9px; }
  .social button {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 52px; border-radius: 12px;
    font-size: 15px; font-weight: 500;
    transition: background-color .16s ease, border-color .16s ease;
  }
  .social .google { background: var(--paper); border: 1px solid var(--edge-2); }
  .social .google:hover { background: var(--paper-2); border-color: var(--ink-3); }
  .social .kakao { background: var(--kakao); color: var(--kakao-ink); }
  .social .kakao:hover { background: #F2DA00; }
  .social svg { width: 18px; height: 18px; }

  .foot { margin-top: 28px; font-size: 13.5px; color: var(--ink-3); text-align: center; }
  .foot button { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

  .cap { font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 22px 0 9px; }
  .cap small { color: var(--ink-3); font-weight: 400; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .picks button {
    padding: 10px 16px; min-height: 44px; border-radius: 999px;
    background: var(--paper-2); color: var(--ink-2); font-size: 14px; font-weight: 500;
    transition: background-color .16s ease, color .16s ease;
  }
  .picks button:hover { background: #EDEEF0; color: var(--ink); }
  .picks button[aria-pressed="true"] { background: var(--coral-tint); color: var(--coral-press); font-weight: 700; }
  .posbad { display: none; margin: 9px 0 0; font-size: 12.5px; color: var(--red); font-weight: 500; }
  .posbad.on { display: block; }

  .note { margin: 20px 0 0; padding: 14px 16px; background: var(--paper-2); border-radius: 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.7; }

  .ok {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 160%);
    z-index: 40; padding: 14px 22px; border-radius: 12px;
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 500;
    transition: transform .26s cubic-bezier(.22,1,.36,1);
  }
  .ok.on { transform: translate(-50%, 0); }

  [hidden] { display: none !important; }

  @media (max-width: 1180px) {
    .split { grid-template-columns: 1fr 1fr; }
    .stage { padding: 32px; }
    .form { padding: 40px 28px; }
  }
  @media (max-width: 940px) {
    .split { grid-template-columns: 1fr; min-height: 0; }
    .stage { min-height: 280px; padding: 28px; }
    .stage .say h1 { font-size: 23px; }
    .form { padding: 40px 24px 64px; }
  }
  @media (max-width: 680px) {
    .stage { min-height: 200px; padding: 20px; }
    .stage .say h1 { font-size: 19px; line-height: 1.45; }
    .stage .say p { display: none; }
    .form { padding: 30px 18px 52px; }
    .head h2 { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>

<div class="split">
  <section class="stage">
    <span class="mark">BANBLIT</span>
    <div class="say">
      <h1>합주실 예약,<br>어렵지 않을 때도 됐으니까.<br>지금, <em>BANBLIT.</em></h1>
      <p>안 되는 시간만 알려주면 나머지는 알아서 굴러갑니다.</p>
    </div>
  </section>

  <main class="form">
    <div class="inner">
      <div class="head">
        <h2 id="ttl">로그인</h2>
        <p id="ttlSub">동아리 계정으로 들어오세요.</p>
      </div>

      <form id="p-in" aria-label="로그인" novalidate>
        <div class="field" id="f-mail">
          <label for="mail">이메일</label>
          <input type="email" id="mail" inputmode="email" autocomplete="email" placeholder="name@example.com">
          <p class="bad"></p>
        </div>
        <div class="field" id="f-pw">
          <label for="pw">비밀번호</label>
          <input type="password" id="pw" autocomplete="current-password" placeholder="8자 이상">
          <p class="bad"></p>
        </div>
        <div class="row">
          <label class="keep"><input type="checkbox" id="keep"> 로그인 상태 유지</label>
          <a href="#">비밀번호를 잊었어요</a>
        </div>
        <button class="go" type="submit">로그인</button>

        <div class="or">또는</div>
        <div class="social">
          <button type="button" class="google" data-who="구글">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.6z"/><path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3C3.7 21.4 7.6 24 12 24z"/><path fill="#FBBC05" d="M5.6 14.7a7.2 7.2 0 0 1 0-4.6v-3H1.8a12 12 0 0 0 0 10.7l3.8-3z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.2 15.1 0 12 0 7.6 0 3.7 2.6 1.8 6.1l3.8 3c.9-2.7 3.4-4.3 6.4-4.3z"/></svg>
            구글로 계속하기
          </button>
          <button type="button" class="kakao" data-who="카카오">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.9 3 2.8 6.3 2.8 10.3c0 2.6 1.7 4.8 4.3 6.1l-1 3.8c-.1.4.3.7.6.5l4.4-2.9c.3 0 .6.1.9.1 5.1 0 9.2-3.3 9.2-7.6S17.1 3 12 3z"/></svg>
            카카오로 계속하기
          </button>
        </div>

        <p class="foot">계정이 없으신가요? <button type="button" id="go-up">회원가입</button></p>
      </form>

      <form id="p-up" aria-label="회원가입" novalidate hidden>
        <div class="field" id="f-name">
          <label for="nm">이름</label>
          <input type="text" id="nm" autocomplete="name" placeholder="부원 명단에 쓸 이름">
          <p class="bad"></p>
        </div>
        <div class="field" id="f-mail2">
          <label for="mail2">이메일</label>
          <input type="email" id="mail2" inputmode="email" autocomplete="email" placeholder="name@example.com">
          <p class="bad"></p>
        </div>
        <div class="field" id="f-pw2">
          <label for="pw2">비밀번호</label>
          <input type="password" id="pw2" autocomplete="new-password" placeholder="8자 이상">
          <p class="bad"></p>
        </div>
        <div class="field" id="f-pw3">
          <label for="pw3">비밀번호 확인</label>
          <input type="password" id="pw3" autocomplete="new-password" placeholder="한 번 더">
          <p class="bad"></p>
        </div>

        <p class="cap">맡는 포지션 <small>여러 개를 고를 수 있어요</small></p>
        <div class="picks" id="picks" role="group" aria-label="포지션">
          <button type="button" aria-pressed="false">보컬</button>
          <button type="button" aria-pressed="false">기타</button>
          <button type="button" aria-pressed="false">베이스</button>
          <button type="button" aria-pressed="false">드럼</button>
          <button type="button" aria-pressed="false">키보드</button>
        </div>
        <p class="posbad" id="posbad">포지션을 하나 이상 골라 주세요.</p>

        <p class="note">이름이 같은 부원이 있어도 괜찮습니다. 화면에서는 맡은 포지션과 소속 팀으로 구분해 보여줍니다.</p>

        <button class="go" type="submit" style="margin-top:22px">가입하기</button>
        <p class="foot">이미 계정이 있으신가요? <button type="button" id="go-in">로그인</button></p>
      </form>
    </div>
  </main>
</div>

<div class="ok" id="ok" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";


  const $ = (id) => document.getElementById(id);

  // 입력값은 보내기 전에 화면에서 한 번 거른다
  const check = (fieldId, msg) => {
    const f = $(fieldId);
    f.classList.toggle("err", Boolean(msg));
    const inp = f.querySelector("input");
    inp.setAttribute("aria-invalid", String(Boolean(msg)));
    f.querySelector(".bad").textContent = msg || "";
    return !msg;
  };
  const mailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  const mailMsg = (v) => !v ? "이메일을 입력해 주세요." : (!mailOk(v) ? "이메일 형식이 맞지 않아요." : "");
  const pwMsg = (v) => !v ? "비밀번호를 입력해 주세요." : (v.length < 8 ? "비밀번호는 8자 이상이에요." : "");

  // 로그인과 회원가입은 서식 아래 글귀로만 오간다
  const show = (up) => {
    $("p-in").hidden = up;
    $("p-up").hidden = !up;
    $("ttl").textContent = up ? "회원가입" : "로그인";
    $("ttlSub").textContent = up ? "이름과 포지션만 있으면 됩니다." : "동아리 계정으로 들어오세요.";
    ($("ttl")).scrollIntoView({ block: "nearest" });
  };
  $("go-up").onclick = () => show(true);
  $("go-in").onclick = () => show(false);

  $("picks").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
  };
  const picked = () => [...$("picks").querySelectorAll('[aria-pressed="true"]')].map((b) => b.textContent);

  $("p-in").addEventListener("submit", (e) => {
    e.preventDefault();
    const a = check("f-mail", mailMsg($("mail").value.trim()));
    const b = check("f-pw", pwMsg($("pw").value));
    if (a && b) say("로그인했어요");
  });

  $("p-up").addEventListener("submit", (e) => {
    e.preventDefault();
    const n = $("nm").value.trim(), p = $("pw2").value, q = $("pw3").value;
    const r1 = check("f-name", n ? "" : "이름을 입력해 주세요.");
    const r2 = check("f-mail2", mailMsg($("mail2").value.trim()));
    const r3 = check("f-pw2", pwMsg(p));
    const r4 = check("f-pw3", q !== p ? "두 비밀번호가 달라요." : "");
    const pos = picked();
    $("posbad").classList.toggle("on", pos.length === 0);
    if (r1 && r2 && r3 && r4 && pos.length) say(n + "님, 가입됐어요 · " + pos.join(", "));
  });

  document.querySelectorAll("[data-who]").forEach((b) => {
    b.onclick = () => say(b.dataset.who + " 계정으로 넘어가요");
  });

  let tm;
  function say(msg) {
    const el = $("ok");
    el.textContent = msg; el.classList.add("on");
    clearTimeout(tm); tm = setTimeout(() => el.classList.remove("on"), 2600);
  }
})();
</script>
