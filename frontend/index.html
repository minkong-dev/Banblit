<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BANBLIT</title>
    <meta
      name="description"
      content="합주시간 배정, 이젠 쉬울때도 됐으니까. 지금, BANBLIT."
    />

    <!-- 링크를 붙여넣었을 때 보이는 제목·설명·이미지입니다. 크롤러는 JavaScript 를 실행하지 않고
         이 파일만 읽으므로, 화면 코드가 아니라 여기에 적어야 합니다.
         %VITE_APP_ORIGIN% 는 묶을 때 실제 주소로 교체됩니다(frontend/Dockerfile 의 build arg).
         og:image 는 절대 주소여야 합니다 — 상대 주소는 카카오톡·페이스북이 받지 못합니다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BANBLIT" />
    <meta property="og:title" content="BANBLIT" />
    <meta property="og:description" content="IN SIX STRINGS" />
    <meta property="og:url" content="%VITE_APP_ORIGIN%" />
    <!-- 카카오는 미리보기 이미지를 주소 기준으로 약 100일 저장하고, 초기화 도구로도 지워지지 않는 경우가 있습니다.
         이미지를 바꾸면 ?v= 숫자를 올립니다. 파일 이름은 그대로 두고 카카오에는 새 주소로 보입니다(카카오 데브톡 답변). -->
    <!-- og:image:width·height 는 두지 않습니다. 넣은 뒤로 카카오 썸네일 서버가 이미지를 한 번도 가져가지 않았고,
         넣기 전(2026-09-22 15:28)에는 가져갔습니다(서버 접속 기록). -->
    <meta property="og:image" content="%VITE_APP_ORIGIN%/images/domain_link_preview.jpg?v=3" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 본문 편집기의 글꼴 선택지에 들어가는 Pretendard Variable 입니다. 다른 선택지(명조·고딕)는
         사용자 기기에 설치된 글꼴을 쓰지만 이것은 설치돼 있지 않으므로 내려받습니다.
         dynamic-subset 은 화면에 실제로 나온 글자만 내려받습니다 — 한글 글꼴 전체는 수 MB 입니다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
