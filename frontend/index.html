<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>BANBLIT</title>

    <!-- 브라우저 탭과 앱 아이콘입니다. 규격은 docs/BANBLIT_CI_GUIDE.pdf 07 APPLICATION 이 정합니다.
         탭은 단독형(반짝임 3획이 없는 형태)입니다 — 16·32px 에서는 반짝임이 뭉개집니다.
         앱 아이콘은 잉크(#16140F) 바탕에 기본형을 올린 180·192·512px 입니다. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#16140F" />
    <meta
      name="description"
      content="합주시간 배정, 이젠 쉬울때도 됐으니까. 지금, BANBLIT."
    />

    <!-- 링크를 붙여넣었을 때 보이는 제목·설명·이미지입니다. 크롤러는 JavaScript 를 실행하지 않고
         이 파일만 읽으므로, 화면 코드가 아니라 여기에 적어야 합니다.
         %VITE_APP_ORIGIN% 는 build 할 때 실제 주소로 치환됩니다(frontend/Dockerfile 의 build arg).
         og:image 는 절대 주소여야 합니다 — 상대 주소는 카카오톡·페이스북이 받지 못합니다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BANBLIT" />
    <meta property="og:title" content="BANBLIT" />
    <meta property="og:description" content="IN SIX STRINGS" />
    <meta property="og:url" content="%VITE_APP_ORIGIN%" />
    <!-- 이미지를 변경하면 ?v= 숫자를 1 올립니다. 카카오는 3초 안에 받지 못한 이미지를 표시하지 않으므로 가로 1200px, 약 110KB 이하로 둡니다. -->
    <meta property="og:image" content="%VITE_APP_ORIGIN%/images/domain_link_preview.jpg?v=4" />
    <meta name="twitter:card" content="summary_large_image" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
